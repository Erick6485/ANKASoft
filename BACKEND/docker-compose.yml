version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: retail_analytics_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hackaton2025
      POSTGRES_DB: retail_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build: .
    container_name: retail_analytics_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:hackaton2025@db:5432/retail_analytics
      SECRET_KEY: clave_secreta_hackaton_2025_fup
      JWT_SECRET_KEY: clave_secreta_hackaton_2025_fup_jwt_token
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEBUG: "True"
      API_KEY: retail_hackaton_2025_fup
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: retail_analytics_network

